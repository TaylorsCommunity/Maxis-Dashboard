<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eKelas Usahawan | Learning & Impact Portal</title>
  <meta name="description" content="Secure learning, programme monitoring and stakeholder reporting portal.">
  <link rel="icon" type="image/png" href="endorsement-logo.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="product.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#" data-page="overview" aria-label="Taylor's Community portal home">
      <img src="endorsement-logo.png" alt="Taylor's Community — an initiative by Taylor's Education Group">
    </a>
    <div class="workspace-label">eKelas Usahawan<small>Learning & impact portal</small></div>
    <div class="nav-caption">WORKSPACE</div>
    <nav id="nav" aria-label="Main navigation"></nav>
    <div class="side-bottom">
      <div class="pathway"><span>PROGRAMME PORTAL</span><strong>Learn. Monitor.<br>Measure impact.</strong><i aria-hidden="true">↗</i></div>
      <div class="delivery">Managed by <b>Taylor’s Community</b></div>
    </div>
  </aside>

  <div class="shell">
    <header class="topbar">
      <div class="breadcrumb">eKelas Usahawan <span>/</span> <b id="crumb">Portal</b></div>
      <div class="account-controls" id="account-control" hidden>
        <button class="account-trigger" id="account-trigger" type="button" aria-haspopup="menu" aria-label="Open account menu">
          <span class="account-name" id="account-name"></span>
          <span class="account-avatar" id="account-avatar" aria-hidden="true">TC</span>
        </button>
        <div class="account-menu" id="account-menu" role="menu" hidden>
          <button type="button" data-page="account" role="menuitem">Account & system</button>
          <button type="button" id="sign-out" role="menuitem">Sign out</button>
        </div>
      </div>
    </header>
    <main id="main" tabindex="-1">
      <div id="content" aria-live="polite"><div class="loading-card">Loading portal…</div></div>
      <footer><b>eKelas Usahawan</b><span>Learning & impact portal</span></footer>
    </main>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="config.js?v=5.0.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js?v=5.0.0"></script>
</body>
</html>
